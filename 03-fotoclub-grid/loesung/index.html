<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <title>Fotoclub Helvetia – Galerie</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header>
            <h1>Fotoclub Helvetia</h1>
            <nav>
                <ul>
                    <li><a href="index.html" class="aktiv">Galerie</a></li>
                    <li><a href="termine.html">Termine</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Bilder unserer Mitglieder</h2>

            <div id="galerie">
                <figure>
                    <img src="bilder/alpen.jpg" alt="Flugzeugblick auf verschneite Alpengipfel">
                    <figcaption>Flug über die Alpen</figcaption>
                </figure>
                <figure>
                    <img src="bilder/bruecke-wallis.jpg" alt="Alte Steinbrücke über einen Bach">
                    <figcaption>Historische Steinbrücke im Wallis</figcaption>
                </figure>
                <figure>
                    <img src="bilder/bern.jpg" alt="Gasse in der Berner Altstadt am Morgen">
                    <figcaption>Kalter Morgen in der Hauptstadt</figcaption>
                </figure>
                <figure>
                    <img src="bilder/zuerich.jpg" alt="Zürich im Abendrot">
                    <figcaption>Flammendes Abendrot über Zürich</figcaption>
                </figure>
                <figure>
                    <img src="bilder/dampfschiff.jpg" alt="Weisses Dampfschiff auf dem Genfersee">
                    <figcaption>Dampfschiff auf dem Genfersee</figcaption>
                </figure>
                <figure>
                    <img src="bilder/lugano.jpg" alt="Lugano mit Blick auf den Luganersee">
                    <figcaption>Lugano mit Aussicht auf den See</figcaption>

        <footer>
